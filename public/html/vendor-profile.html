<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- shared stylesheets -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <!-- Profile page stylesheet -->
    <link rel="stylesheet" href="../css/pages/vendor-profile.css" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Google rounded icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
      rel="stylesheet"
    />
    <title>Vendor Profile</title>
  </head>
  <body data-page="vendor-profile">
    <!-- navigation bar -->
    <nav
      class="nav-bar"
      id="vendor-navigation"
      data-component="vendor-navigation"
    >
      <a class="nav-link" href="vendor-home.html" data-nav-target="home">
        Home
      </a>
      <a class="nav-link" href="vendor-menu.html" data-nav-target="menu">
        Menu
      </a>
      <a class="nav-link" href="vendor-orders.html" data-nav-target="orders">
        Orders
      </a>
      <a
        class="nav-link"
        href="vendor-promotions.html"
        data-nav-target="promotions"
      >
        Promotions
      </a>
      <a
        class="nav-link"
        href="vendor-feedback.html"
        data-nav-target="feedback"
      >
        Feedback
      </a>
      <a
        class="nav-link active"
        href="vendor-profile.html"
        aria-current="page"
        data-nav-target="profile"
      >
        Profile
      </a>
    </nav>

    <!-- page -->
    <main class="vendor-profile-layout" id="vendor-profile-page">
      <section class="profile-content">
        <!-- page heading -->
        <div class="profile-page-heading">
          <h2>Profile</h2>

          <p class="profile-page-description">
            Manage your stall information, business details and account
            settings.
          </p>
        </div>

        <!-- profile grid -->
        <div class="profile-grid">
          <!-- stall information -->
          <section class="profile-card">
            <div class="profile-card-header">
              <h3>Stall Information</h3>
            </div>

            <form id="stall-information-form" class="profile-card-body">
              <div class="profile-logo">
                <div class="profile-logo-preview">
                  <span class="material-symbols-rounded"> storefront </span>
                </div>

                <button
                  type="button"
                  class="profile-upload-button"
                  id="change-logo-button"
                >
                  Change Logo
                </button>
              </div>

              <label class="profile-field">
                <span> Stall Name </span>

                <input
                  type="text"
                  id="stall-name"
                  name="stallName"
                  value="Ah Seng Chicken Rice"
                  required
                />
              </label>

              <label class="profile-field">
                <span> Cuisine </span>

                <input
                  type="text"
                  id="stall-cuisine"
                  name="cuisine"
                  value="Chinese"
                  required
                />
              </label>

              <label class="profile-field">
                <span> Stall Description </span>

                <textarea id="stall-description" name="description" rows="5">
Traditional chicken rice made fresh daily using premium ingredients.
                </textarea>
              </label>
              <label class="profile-field">
                <span> Hawker Centre </span>

                <input
                  type="text"
                  id="stall-location"
                  name="location"
                  value="Maxwell Food Centre"
                  required
                />
              </label>

              <label class="profile-field">
                <span> Unit Number </span>

                <input
                  type="text"
                  id="stall-unit"
                  name="unit"
                  value="#01-01"
                  required
                />
              </label>

              <div class="profile-card-footer">
                <button type="submit" class="profile-save-button">
                  Save Changes
                </button>
              </div>
            </form>
          </section>

          <!-- contact information -->
          <section class="profile-card">
            <div class="profile-card-header">
              <h3>Contact Information</h3>
            </div>

            <form id="contact-information-form" class="profile-card-body">
              <label class="profile-field">
                <span> Contact Person </span>

                <input
                  type="text"
                  id="contact-name"
                  name="contactName"
                  value="Ah Seng"
                  required
                />
              </label>

              <label class="profile-field">
                <span> Email Address </span>

                <input
                  type="email"
                  id="contact-email"
                  name="email"
                  value="ahseng@email.com"
                  required
                />
              </label>

              <label class="profile-field">
                <span> Phone Number </span>

                <input
                  type="tel"
                  id="contact-phone"
                  name="phone"
                  value="91234567"
                  required
                />
              </label>

              <div class="profile-card-footer">
                <button type="submit" class="profile-save-button">
                  Save Changes
                </button>
              </div>
            </form>
          </section>

          <!-- business information -->
          <section class="profile-card">
            <div class="profile-card-header">
              <h3>Business Information</h3>
            </div>

            <form id="business-information-form" class="profile-card-body">
              <label class="profile-field">
                <span> Business Name </span>

                <input
                  type="text"
                  id="business-name"
                  name="businessName"
                  value="Ah Seng Chicken Rice Pte Ltd"
                />
              </label>

              <label class="profile-field">
                <span> UEN Number </span>

                <input
                  type="text"
                  id="business-uen"
                  name="uen"
                  value="202612345A"
                />
              </label>

              <label class="profile-field">
                <span> GST Registered </span>

                <select id="business-gst" name="gstRegistered">
                  <option value="yes">Yes</option>

                  <option value="no" selected>No</option>
                </select>
              </label>

              <div class="profile-card-footer">
                <button type="submit" class="profile-save-button">
                  Save Changes
                </button>
              </div>
            </form>
          </section>

          <!-- password & security -->
          <section class="profile-card">
            <div class="profile-card-header">
              <h3>Password & Security</h3>
            </div>

            <form id="password-form" class="profile-card-body">
              <label class="profile-field">
                <span> Current Password </span>

                <input
                  type="password"
                  id="current-password"
                  name="currentPassword"
                  required
                />
              </label>

              <label class="profile-field">
                <span> New Password </span>

                <input
                  type="password"
                  id="new-password"
                  name="newPassword"
                  required
                />
              </label>

              <label class="profile-field">
                <span> Confirm Password </span>

                <input
                  type="password"
                  id="confirm-password"
                  name="confirmPassword"
                  required
                />
              </label>

              <div class="profile-card-footer">
                <button type="submit" class="profile-save-button">
                  Update Password
                </button>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>

    <!-- page javascript -->
    <script src="../js/vendor-profile.js"></script>
  </body>
</html>
