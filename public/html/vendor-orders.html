<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <!-- Shared stylesheets -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />

    <!-- Orders page stylesheet -->
    <link rel="stylesheet" href="../css/pages/vendor-orders.css" />

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Noto+Serif:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google rounded icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
      rel="stylesheet"
    />

    <title>Vendor Orders</title>
  </head>

  <body data-page="vendor-orders">
    <!-- Navigation bar -->
    <nav
      class="nav-bar"
      id="vendor-navigation"
      data-component="vendor-navigation"
    >
      <a class="nav-link" href="vendor-home.html" data-nav-target="home">
        Home
      </a>
      <a class="nav-link" href="vendor-menu.html" data-nav-target="menu">
        Menu
      </a>
      <a
        class="nav-link active"
        href="vendor-orders.html"
        aria-current="page"
        data-nav-target="orders"
      >
        Orders
      </a>
      <a
        class="nav-link"
        href="vendor-promotions.html"
        data-nav-target="promotions"
      >
        Promotions
      </a>
      <a
        class="nav-link"
        href="vendor-feedback.html"
        data-nav-target="feedback"
      >
        Feedback
      </a>
      <a class="nav-link" href="vendor-profile.html" data-nav-target="profile">
        Profile
      </a>
    </nav>

    <!-- Stall selector -->
    <header
      class="orders-stall-selector"
      id="vendor-stall-selector"
      data-component="stall-selector"
    >
      <div class="stall-details">
        <p class="stall-name" id="selected-stall-name" data-field="stall-name">
          Loading stall...
        </p>
        <address
          class="stall-address"
          id="selected-stall-address"
          data-field="stall-address"
        ></address>
      </div>

      <div class="stall-switcher">
        <button
          type="button"
          class="switch-stall-button"
          id="switch-stall-button"
          aria-expanded="false"
          aria-controls="stall-dropdown"
          data-action="toggle-stall-dropdown"
        >
          <span class="material-symbols-rounded">storefront</span>
          <span>Switch stalls</span>
          <span class="material-symbols-rounded dropdown-arrow">
            keyboard_arrow_down
          </span>
        </button>

        <div
          class="stall-dropdown"
          id="stall-dropdown"
          hidden
          data-role="stall-options"
        ></div>
      </div>
    </header>

    <!-- Orders page -->
    <main
      class="orders-page"
      id="vendor-orders-page"
      data-page-content="orders"
    >
      <!-- Page heading -->
      <header class="orders-page-heading" data-component="page-heading">
        <h1>Orders</h1>
        <p>View and manage orders received by your selected stall.</p>
      </header>

      <!-- Search -->
      <section class="orders-toolbar" aria-label="Order search">
        <label class="orders-search">
          <span class="material-symbols-rounded">search</span>
          <input
            type="search"
            id="order-search-input"
            placeholder="Search order ID or customer"
            aria-label="Search orders"
            autocomplete="off"
            name="order-search"
            data-filter="search"
          />
        </label>
      </section>

      <!-- Filters -->
      <section class="filters" id="filters" aria-label="Order filters">
        <label class="orders-filter">
          <span>Date</span>
          <input
            type="date"
            id="date-filter"
            name="order-date"
            data-filter="date"
          />
        </label>

        <label class="orders-filter">
          <span>Order Type</span>
          <select id="type-filter" name="order-type" data-filter="order-type">
            <option value="all">All order types</option>
            <option value="Dine-in">Dine-in</option>
            <option value="Pickup">Pickup</option>
            <option value="Delivery">Delivery</option>
          </select>
        </label>

        <label class="orders-filter">
          <span>Order Status</span>
          <select id="status-filter" name="order-status" data-filter="status">
            <option value="all">All statuses</option>
            <option value="Pending">Pending</option>
            <option value="Preparing">Preparing</option>
            <option value="Ready for Collection">Ready for Collection</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </label>

        <button
          type="button"
          class="clear-filter-button"
          id="clear-filter-button"
          data-action="clear-filters"
        >
          Clear filters
        </button>
      </section>

      <!-- Orders table -->
      <section class="orders-table-section" aria-label="Orders list">
        <div class="table-scroll">
          <table class="orders-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Date &amp; Time</th>
                <th>Total</th>
                <th>Order Type</th>
                <th>Special Request</th>
                <th>Order Status</th>
                <th>
                  <span class="visually-hidden">Actions</span>
                </th>
              </tr>
            </thead>

            <!-- Orders are inserted by JavaScript -->
            <tbody id="orders-table-body"></tbody>
          </table>
        </div>

        <!-- No results message -->
        <p class="no-orders-message" id="no-orders-message" hidden>
          No orders match the selected search and filters.
        </p>
      </section>
    </main>

    <!-- Order details dialog -->
    <div class="order-dialog" id="order-dialog" hidden>
      <div class="dialog-header">
        <div>
          <p class="dialog-eyebrow">Order details</p>
          <h2 id="dialog-order-id">Order</h2>
        </div>
      </div>

      <!-- Order details are inserted by JavaScript -->
      <div class="dialog-body" id="dialog-body"></div>

      <div class="dialog-footer">
        <button
          type="button"
          class="secondary-button"
          id="dialog-secondary-close"
          data-action="close-order-dialog"
        >
          Close
        </button>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="../js/vendor-orders.js"></script>
  </body>
</html>
